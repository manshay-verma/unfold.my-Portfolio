{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Unfold.My</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --accent: #7c6af5; --accent2: #a78bfa; }
    body {
      margin: 0; font-family: 'Inter', sans-serif;
      background: #0d0f14; color: #e2e8f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      width: 100%; max-width: 420px;
      background: #13161e; border: 1px solid rgba(255,255,255,.07);
      border-radius: 20px; padding: 48px 40px;
    }
    .login-logo {
      font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
      color: var(--accent2); margin-bottom: 8px;
    }
    .login-logo span { color: var(--accent); }
    .login-subtitle { color: #8892a4; font-size: 14px; margin-bottom: 36px; }
    label { font-size: 13px; font-weight: 500; color: #8892a4; margin-bottom: 6px; display: block; }
    .input-wrap { position: relative; margin-bottom: 18px; }
    .input-wrap i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #8892a4; font-size: 14px; pointer-events: none;
    }
    .form-input {
      width: 100%; background: #1a1d28; border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px; padding: 11px 14px 11px 38px; color: #e2e8f0;
      font-size: 14px; outline: none; font-family: inherit; transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--accent); }
    .btn-login {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s; font-family: inherit; margin-top: 8px;
    }
    .btn-login:hover { background: #6a58e0; }
    .error-msg {
      background: rgba(245,101,101,.1); color: #f56565;
      border: 1px solid rgba(245,101,101,.2); border-radius: 10px;
      padding: 10px 14px; font-size: 13.5px; margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">Unfold<span>.</span>My</div>
    <p class="login-subtitle">Admin Panel — Staff access only</p>

    {% if messages %}
      {% for msg in messages %}
        <div class="error-msg"><i class="fa-solid fa-circle-xmark"></i> {{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'admin_panel:login' %}">
      {% csrf_token %}
      <label for="username">Username</label>
      <div class="input-wrap">
        <i class="fa-solid fa-user"></i>
        <input id="username" name="username" type="text" class="form-input" placeholder="Enter username" required autofocus>
      </div>
      <label for="password">Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input id="password" name="password" type="password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i></button>
    </form>
  </div>
</body>
</html>
